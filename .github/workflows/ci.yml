name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: horse_management
    env:
      SECRET_KEY: ci-only-not-a-real-secret-key-0123456789abcdef
      DEBUG: 'True'
      DJANGO_SETTINGS_MODULE: horse_management.test_settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: horse_management/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt is a lockfile with hashes, so pip checks every
          # download. Tools not in it are installed in a separate step:
          # hash-checking mode refuses any package without a hash.
          pip install --require-hashes -r requirements.txt
          pip install ruff

      - name: Lint (ruff, errors only)
        run: ruff check .

      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: Tests
        run: python manage.py test --noinput --parallel auto

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: JavaScript unit tests (static/js/tests)
        run: node --test 'static/js/tests/*.test.js'

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build the site
        run: npm run build
