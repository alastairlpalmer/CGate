name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: horse_management
    env:
      SECRET_KEY: ci-only-not-a-real-secret-key-0123456789abcdef
      DEBUG: 'True'
      DJANGO_SETTINGS_MODULE: horse_management.test_settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: horse_management/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt is a lockfile with hashes, so pip checks every
          # download. Tools not in it are installed in a separate step:
          # hash-checking mode refuses any package without a hash.
          pip install --require-hashes -r requirements.txt
          pip install ruff

      - name: Lint (ruff, errors only)
        run: ruff check .

      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: Tests
        run: python manage.py test --noinput --parallel auto

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: JavaScript unit tests (static/js/tests)
        run: node --test 'static/js/tests/*.test.js'

  # The same tests on PostgreSQL, the database production uses. SQLite
  # ignores row locks (select_for_update) and some constraints, so a bug
  # there passes the job above and fails only in production.
  test-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: horse_management
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cgate
          POSTGRES_PASSWORD: cgate
          POSTGRES_DB: cgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cgate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-real-secret-key-0123456789abcdef
      DEBUG: 'True'
      DJANGO_SETTINGS_MODULE: horse_management.test_settings_pg
      TEST_DATABASE_URL: postgres://cgate:cgate@localhost:5432/cgate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: horse_management/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          # tblib: the parallel runner needs it to show a test's traceback.
          pip install tblib

      - name: Migrations from an empty database
        env:
          DJANGO_SETTINGS_MODULE: horse_management.settings
          DATABASE_URL: postgres://cgate:cgate@localhost:5432/cgate
        run: python manage.py migrate --noinput

      - name: Tests on PostgreSQL
        run: python manage.py test --noinput --parallel auto

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build the site
        run: npm run build
