name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: horse_management
    env:
      SECRET_KEY: ci-only-not-a-real-secret-key-0123456789abcdef
      DEBUG: 'True'
      DJANGO_SETTINGS_MODULE: horse_management.test_settings
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: horse_management/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint (ruff, errors only)
        run: ruff check .

      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: Tests
        run: python manage.py test --noinput --parallel auto

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript unit tests (static/js/tests)
        run: node --test 'static/js/tests/*.test.js'
