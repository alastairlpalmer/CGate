{% extends 'base.html' %}

{% block title %}Pedigree - {{ horse.name }} - Cgate{% endblock %}

{% block content %}
<div class="max-w-2xl space-y-4">
    <a href="{% url 'horse_detail' horse.pk %}" class="inline-flex items-center gap-1.5 text-sm text-sage hover:text-forest tap-pad">← {{ horse.name }}</a>
    <div class="card">
        <div class="section-header">
            <h1 class="section-title">Pedigree for {{ horse.name }}</h1>
        </div>
        {% include 'pedigree/partials/edit_form.html' with full_page=True %}
    </div>
</div>
{% endblock %}
