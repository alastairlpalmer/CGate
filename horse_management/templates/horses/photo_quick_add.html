{% extends 'base.html' %}

{% block title %}Add Photos for {{ horse.name }} - Yardway{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">

    <!-- Page Header -->
    <div class="page-header">
        <div class="flex items-center gap-3">
            {% include 'horses/_horse_avatar.html' with horse=horse size='md' %}
            <div>
                <h1 class="page-title">Add Photos</h1>
                <p class="page-subtitle">{{ horse.name }}</p>
            </div>
        </div>
    </div>

    <!-- Quick Add Form (same partial the pop-up sheet loads) -->
    <div class="card">
        {% include 'horses/partials/photo_form.html' %}
    </div>

</div>
{% endblock %}
