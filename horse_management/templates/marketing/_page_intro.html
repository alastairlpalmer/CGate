<section class="relative overflow-hidden bg-parchment pt-16 lg:pt-20" aria-labelledby="page-title">
    <svg class="absolute inset-0 h-full w-full text-forest opacity-[0.05]" aria-hidden="true" focusable="false">
        <defs><pattern id="intro-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="currentColor"/></pattern></defs>
        <rect width="100%" height="100%" fill="url(#intro-grid)"/>
    </svg>
    <div class="relative mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8 lg:py-14">
        {% if eyebrow %}<p class="mk-fade-in text-sm font-semibold uppercase tracking-[0.14em] text-saddle">{{ eyebrow }}</p>{% endif %}
        <h1 id="page-title" class="mk-fade-in mt-2 max-w-3xl font-heading text-4xl font-normal leading-[1.05] tracking-[-0.02em] text-forest sm:text-5xl" style="--d:.1s">{{ title }}</h1>
        <p class="mk-fade-in mt-4 max-w-2xl text-lg leading-relaxed text-sage" style="--d:.2s">{{ intro }}</p>
    </div>
</section>
