{% comment %}The "Contact support" box at the foot of every help page.{% endcomment %}
<aside class="help-contact" aria-labelledby="help-contact-title">
    <div class="help-contact-icon" aria-hidden="true">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/></svg>
    </div>
    <div class="min-w-0">
        <h2 id="help-contact-title" class="text-sm font-semibold text-charcoal">Contact support</h2>
        <p class="mt-0.5 text-sm text-sage">Not in the guides? Send an email. Tell us the page you were on and what you tried to do.</p>
        <a href="mailto:{{ support_email }}" hx-boost="false" class="mt-2 inline-flex link text-sm font-medium">{{ support_email }}</a>
    </div>
</aside>
