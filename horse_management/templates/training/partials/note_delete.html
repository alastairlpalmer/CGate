<form method="post" action="{% url 'training_note_delete' note.pk %}"
      hx-post="{% url 'training_note_delete' note.pk %}" hx-target="#popup-body" hx-select="unset" hx-swap="innerHTML" hx-push-url="false">
    {% csrf_token %}
    <div class="px-4 py-3 space-y-2 text-sm">
        <p>Delete this note?</p>
        <p class="font-medium">{{ note.horse.name }} &middot; {{ note.date|date:"D j M Y" }}</p>
        <p class="text-charcoal-light">{{ note.text|truncatechars:200 }}</p>
    </div>
    <div class="popup-footer">
        <button type="button" class="btn-secondary" @click="$store.popup.close()">Cancel</button>
        <button type="submit" class="btn-danger">Delete</button>
    </div>
</form>
