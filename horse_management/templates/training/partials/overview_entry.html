{# One Needs attention row on the Overview: the whole row is the link (fault M5). #}
<a href="{{ entry.url }}" class="flex items-center gap-2 px-4 py-2.5 min-h-[48px] hover:bg-cream/60">
    <span class="badge-{% if tone == 'warn' %}warning{% elif tone == 'info' %}info{% else %}neutral{% endif %} shrink-0">{{ entry.badge }}</span>
    <span class="flex-1 min-w-0 text-sm text-charcoal truncate">{{ entry.name }}{% if entry.detail %} <span class="text-sage">&middot; {{ entry.detail }}</span>{% endif %}</span>
    <svg class="w-4 h-4 text-sage shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
</a>
