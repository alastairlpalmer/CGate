<section id="horse-list" class="space-y-2" aria-labelledby="list-heading">
    <h2 id="list-heading" class="text-sm uppercase tracking-wide text-sage">Today's horses ({{ list_horses|length }})</h2>
    {% for horse in list_horses %}
    {% include "farrier/_horse_row.html" %}
    {% empty %}
    <p class="rounded-lg bg-white border border-light-sage px-4 py-3 text-sm">The yard has no horses on your list today. Find a horse below to add your work.</p>
    {% endfor %}
</section>
